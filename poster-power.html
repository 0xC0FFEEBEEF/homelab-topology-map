<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>power failure</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  /* Layout: one long page on pitch black. Open bands split by hairlines; figures fill the column and
     can switch to full size with sideways scroll. Colour means network, violet means slerm. */
  --bg: #000000;
  --card: #06080c;
  --raise: #0e1118;
  --line: #1b2029;
  --line-2: #2a313d;
  --text: #e7ecf3;
  --text-2: #a4aebd;
  --muted: #677284;
  --accent: #8ea8ff;
  --violet: #b69bff;
  --violet-wash: rgba(182,155,255,.12);
  --lan: #3ddc97;
  --mgmt: #f3b64b;
  --srv: #8ea8ff;
  --dmz: #ff7a90;
  --bad: #ff6b6b;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }

/* svg */
.pz { display: block; height: auto; }
.pz text { font-family: var(--sans); font-size: 12.5px; fill: var(--text-2); }
.pz .m { font-family: var(--mono); font-size: 11px; }
.pz .sm { font-size: 12.5px; }
.pz .xs { font-size: 10.5px; }
.pz .ey { font-size: 10px; letter-spacing: .14em; font-weight: 500; fill: var(--muted); }
.pz .ti { font-size: 17px; font-weight: 600; fill: var(--text); letter-spacing: -.01em; }
.pz .nm { font-size: 13px; font-weight: 600; fill: var(--text); }
.pz .big { font-size: 30px; font-weight: 600; fill: var(--text); letter-spacing: -.02em; }
.pz .mu, .pz tspan.mu { fill: var(--muted); }
.pz .tx { fill: var(--text); }
.pz .card { fill: var(--card); stroke: var(--line-2); stroke-width: 1; }
.pz .frame { fill: none; }
.pz .card-hi { stroke: #3a4352; }
.pz .parked-card { stroke-dasharray: 4 4; }
.pz .hr { stroke: var(--line); stroke-width: 1; }
.pz .grid { stroke: var(--line); stroke-width: 1; }
.pz .w { fill: none; stroke-width: 2.25; stroke-linecap: round; }
.pz .stub { fill: none; stroke-width: 3; stroke-linecap: round; }
.pz .halo { fill: none; stroke: var(--bg); stroke-width: 9; }
.pz .nt { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.pz .dash { stroke-dasharray: 5 5; }
.pz .req { fill: none; stroke: var(--violet); stroke-width: 1.75; }
.pz .ah { fill: var(--muted); }
.pz .pw-b { fill: none; stroke: var(--text-2); stroke-width: 2; }
.pz .pw-s { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 4; }
.pz .psu { fill: var(--text-2); }
.pz .st-run { fill: var(--text); }
.pz .st-off { fill: var(--bg); stroke: var(--text-2); stroke-width: 1.25; }
.pz .pill { fill: none; stroke-width: 1; }
.pz .p-tun { stroke: var(--line-2); }
.pz .pt-tun { fill: var(--text-2); }
.pz .p-slerm { stroke: var(--violet); }
.pz .pt-slerm { fill: var(--violet); }
.pz .p-state { stroke: var(--line-2); fill: var(--card); }
.pz .s-lan { stroke: var(--lan); } .pz .f-lan { fill: var(--lan); }
.pz .s-mgmt { stroke: var(--mgmt); } .pz .f-mgmt { fill: var(--mgmt); }
.pz .s-srv { stroke: var(--srv); } .pz .f-srv { fill: var(--srv); }
.pz .s-dmz { stroke: var(--dmz); } .pz .f-dmz { fill: var(--dmz); }
.pz .seg { stroke: none; }
.pz .gpu1 { fill: var(--violet); } .pz .gpu2 { fill: #8f74e0; }
.pz .cpu1 { fill: #5d6678; } .pz .cpu2 { fill: #4b5364; } .pz .cpu3 { fill: #7a8499; }
.pz .seg-t { fill: #0b0d12; font-weight: 500; }
.pz .bar { fill: var(--violet); }
.pz .b-wait { fill: #3a4352; }
.pz .b-off { fill: var(--text-2); }
.pz .b-keep { fill: #1c2230; stroke: var(--line-2); }
.pz .b-slerm { fill: rgba(182,155,255,.16); stroke: rgba(182,155,255,.45); }
.pz .b-keep + text, .pz .b-slerm + text { fill: var(--text-2); }
.pz .deadline { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 4 3; }
.pz .dl { fill: var(--bad); }

/* motion: packets ride the wires, running dots breathe, tunnels march, the outage replays.
   Everything here is off unless the page sets .motion on the root, so the PNG posters stay still. */
.pz .pk { pointer-events: none; }
:root:not(.motion) .pz .pk { display: none; }
.pz .pk-c { fill: currentColor; }
.pz .pk-h { fill: currentColor; opacity: .2; }
.pz .k-text { color: var(--text); } .pz .k-power { color: var(--text-2); } .pz .k-violet { color: var(--violet); }
.pz .k-lan { color: var(--lan); } .pz .k-mgmt { color: var(--mgmt); }
.pz .k-srv { color: var(--srv); } .pz .k-dmz { color: var(--dmz); }
.pz .ph { display: none; pointer-events: none; transition: opacity .6s var(--ease); }
.motion .pz .ph.on { display: inline; }
.pz .ph-veil { fill: var(--bg); opacity: .62; }
.pz .ph-line { stroke: var(--text); stroke-width: 1.25; }
.pz .ph-tag { fill: var(--text); }
.pz .ph-t { font-family: var(--mono); font-size: 10.5px; font-weight: 500; fill: var(--bg); }
.motion .pz .st-run { animation: breathe 3.6s ease-in-out infinite; }
.motion .pz .dash { animation: march 1.6s linear infinite; }
.motion .pz .p-state { animation: state-on 10s linear infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes march { to { stroke-dashoffset: 10; } }
@keyframes state-on {
  0%, 22% { stroke: var(--violet); fill: var(--violet-wash); }
  26%, 100% { stroke: var(--line-2); fill: var(--card); }
}

/* scroll reveal: the page hides only what starts below the fold (.rv-on on the root), then builds each
   diagram as it scrolls in. Cards rise, wires draw, bars grow, text settles; traffic starts when it's done. */
.rv-on .pz .rv-s { opacity: 0; animation: none; }
.rv-on .pz .rv-in { animation: rv-fade .55s var(--ease) both; }
.rv-on .pz text.rv-in { animation-name: rv-rise; animation-duration: .65s; }
.rv-on .pz .card.rv-in { animation: rv-card .75s var(--ease) both; transform-box: fill-box; transform-origin: 50% 50%; }
.rv-on .pz line.rv-in.w, .rv-on .pz line.rv-in.req, .rv-on .pz line.rv-in.pw-b,
.rv-on .pz line.rv-in.nt:not(.dash), .rv-on .pz path.rv-in.nt {
  stroke-dasharray: var(--len) var(--len); animation: rv-draw .95s var(--ease) both; }
.rv-on .pz .rv-in.b-wait, .rv-on .pz .rv-in.b-off, .rv-on .pz .rv-in.b-keep, .rv-on .pz .rv-in.b-slerm,
.rv-on .pz .rv-in.bar, .rv-on .pz .rv-in.seg {
  animation: rv-grow .9s var(--ease) both; transform-box: fill-box; transform-origin: 0 50%; }
.rv-on .pz.rv-pending .pk, .rv-on .pz.rv-pending .ph { visibility: hidden; }
@keyframes rv-fade { from { opacity: 0; } }
@keyframes rv-rise { from { opacity: 0; translate: 0 8px; } }
@keyframes rv-card { from { opacity: 0; scale: .96; } }
@keyframes rv-draw { 0% { stroke-dashoffset: var(--len); opacity: 0; } 25% { opacity: 1; } }
@keyframes rv-grow { from { scale: 0 1; } }
 body { margin: 0; } .pz { width: auto; }</style></head>
<body><svg class="pz " viewBox="0 0 1680 972" width="1680" height="972" role="img" aria-label="Power failure timeline: after a 15 second grace, ups-guardian powers off byteme and deadlock and shuts byteme2&#x27;s guests in parallel, all inside a 240 second deadline, well within the UPS runtime; DNS and the tailnet router keep running." data-w="1680"><defs><marker id="ah-pwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="60" y="62" class="big">power failure<tspan class="mu"> · ups-guardian</tspan></text><text x="60" y="90" class="sm mu">CyberPower LX1500GAVR on USB to byteme2 · pwrstatd polls every 3 s · ~64 min of runtime at today&#x27;s idle 108 W</text><text x="60" y="136" class="ey">FIRST MINUTES ON BATTERY · DRAWN TO SCALE</text><line x1="300" y1="176" x2="300" y2="596" class="grid"/><text x="300" y="168" class="m xs mu" text-anchor="middle">0:00</text><line x1="410" y1="176" x2="410" y2="596" class="grid"/><text x="410" y="168" class="m xs mu" text-anchor="middle">0:30</text><line x1="520" y1="176" x2="520" y2="596" class="grid"/><text x="520" y="168" class="m xs mu" text-anchor="middle">1:00</text><line x1="630" y1="176" x2="630" y2="596" class="grid"/><text x="630" y="168" class="m xs mu" text-anchor="middle">1:30</text><line x1="740" y1="176" x2="740" y2="596" class="grid"/><text x="740" y="168" class="m xs mu" text-anchor="middle">2:00</text><line x1="850" y1="176" x2="850" y2="596" class="grid"/><text x="850" y="168" class="m xs mu" text-anchor="middle">2:30</text><line x1="960" y1="176" x2="960" y2="596" class="grid"/><text x="960" y="168" class="m xs mu" text-anchor="middle">3:00</text><line x1="1070" y1="176" x2="1070" y2="596" class="grid"/><text x="1070" y="168" class="m xs mu" text-anchor="middle">3:30</text><line x1="1180" y1="176" x2="1180" y2="596" class="grid"/><text x="1180" y="168" class="m xs mu" text-anchor="middle">4:00</text><line x1="1290" y1="176" x2="1290" y2="596" class="grid"/><text x="1290" y="168" class="m xs mu" text-anchor="middle">4:30</text><line x1="1400" y1="176" x2="1400" y2="596" class="grid"/><text x="1400" y="168" class="m xs mu" text-anchor="middle">5:00</text><line x1="1510" y1="176" x2="1510" y2="596" class="grid"/><text x="1510" y="168" class="m xs mu" text-anchor="middle">5:30</text><line x1="1620" y1="176" x2="1620" y2="596" class="grid"/><text x="1620" y="168" class="m xs mu" text-anchor="middle">6:00</text><text x="60" y="206" class="nm">pwrstatd</text><text x="60" y="222" class="xs mu">UPS reports mains lost</text><text x="60" y="252" class="nm">blip filter</text><text x="60" y="268" class="xs mu">cancel if mains return</text><text x="60" y="298" class="nm">byteme</text><text x="60" y="314" class="xs mu">Dell R730 · slerm GPUs</text><text x="60" y="344" class="nm">deadlock</text><text x="60" y="360" class="xs mu">slerm-node05</text><text x="60" y="390" class="nm">byteme2 guests</text><text x="60" y="406" class="xs mu">all at once</text><text x="60" y="436" class="nm">byteme2 host</text><text x="60" y="452" class="xs mu">HP DL360</text><text x="60" y="482" class="nm">DNS + CFT</text><text x="60" y="498" class="xs mu">Technitium · tailnet router</text><text x="60" y="528" class="nm">Starlink + Wi-Fi</text><text x="60" y="544" class="xs mu">network gear</text><text x="60" y="574" class="nm">slerm</text><text x="60" y="590" class="xs mu">orchestrator</text><circle cx="300" cy="203" r="5" class="st-run"/><text x="314" y="207" class="sm">mains lost → ups-guardian onbatt; slerm is told at once</text><rect x="300" y="242" width="55" height="14" rx="3" class="b-wait"/><text x="365" y="253" class="sm">waits 15 s · short blips end here with nothing touched · skipped if the battery already reads low</text><rect x="355" y="288" width="330" height="14" rx="3" class="b-off"/><text x="695" y="299" class="sm">iDRAC soft power-off (Proxmox shuts its VMs) · forced off at 90 s if still up</text><rect x="355" y="334" width="550" height="14" rx="3" class="b-off"/><text x="915" y="345" class="sm">BMC soft power-off · 150 s to confirm</text><rect x="355" y="380" width="220" height="14" rx="3" class="b-off"/><rect x="575" y="380" width="440" height="14" rx="3" class="b-wait"/><text x="583" y="391" class="m xs tx">9 guests at once · 60 s grace (25 s with no agent, Wuzah 180 s)</text><rect x="1015" y="426" width="605" height="14" rx="3" class="b-keep"/><text x="1190" y="437" class="m xs seg-t">iLO power cap 107 W once the guests are down</text><rect x="300" y="472" width="1320" height="14" rx="3" class="b-keep"/><text x="308" y="483" class="m xs seg-t">keep running for DNS and remote access until low battery</text><rect x="300" y="518" width="1320" height="14" rx="3" class="b-keep"/><text x="308" y="529" class="m xs seg-t">stays up, and keeps going after byteme2 halts</text><rect x="300" y="564" width="1320" height="14" rx="3" class="b-slerm"/><text x="308" y="575" class="m xs seg-t">told at once and every 60 s · running jobs frozen · no node power-ons</text><line x1="1180" y1="176" x2="1180" y2="604" class="deadline"/><text x="1186" y="618" class="m xs dl">4 min hard deadline: anything still up is force-stopped</text><text x="1620" y="146" class="m xs mu" text-anchor="end">ups-guardian is sized for ~7 min of battery under load</text><g class="ph" data-x0="300" data-x1="1620" data-t="360"><rect class="ph-veil" x="300" y="176" width="1380" height="448"/><line class="ph-line" x1="300" y1="164" x2="300" y2="600"/><rect class="ph-tag" x="278" y="153" width="44" height="19" rx="9.5"/><text class="ph-t" x="300" y="166.5" text-anchor="middle">0:00</text></g><text x="60" y="666" class="ey">LOW BATTERY</text><text x="60" y="688" class="sm">At 35 % charge or under 5 min of runtime, judged once byteme is confirmed off: force-stop anything left, shut down Technitium and CFT, halt byteme2.</text><text x="60" y="708" class="sm">Starlink and the Wi-Fi outlast it on the UPS, so the house keeps internet a while longer.</text><text x="60" y="752" class="ey">POWER BACK · RESTORE WATCHER CHECKS EVERY 15 S</text><rect x="60" y="768" width="288" height="64" rx="10" class="card frame"/><text x="74" y="792" class="m sm mu">1</text><text x="94" y="792" class="nm">Lift the cap</text><text x="74" y="814" class="sm mu">byteme2&#x27;s iLO power cap comes off</text><line x1="351" y1="800" x2="374" y2="800" class="nt" marker-end="url(#ah-pwr)"/><rect x="378" y="768" width="288" height="64" rx="10" class="card frame"/><text x="392" y="792" class="m sm mu">2</text><text x="412" y="792" class="nm">Power on byteme</text><text x="392" y="814" class="sm mu">via iDRAC, never within 150 s of the power-off</text><line x1="669" y1="800" x2="692" y2="800" class="nt" marker-end="url(#ah-pwr)"/><rect x="696" y="768" width="288" height="64" rx="10" class="card frame"/><text x="710" y="792" class="m sm mu">3</text><text x="730" y="792" class="nm">Restart byteme&#x27;s VMs</text><text x="710" y="814" class="sm mu">pve-guest-restore: slerm-head first, then the rest</text><line x1="987" y1="800" x2="1010" y2="800" class="nt" marker-end="url(#ah-pwr)"/><rect x="1014" y="768" width="288" height="64" rx="10" class="card frame"/><text x="1028" y="792" class="m sm mu">4</text><text x="1048" y="792" class="nm">Restart byteme2 guests</text><text x="1028" y="814" class="sm mu">exactly the list it stopped</text><line x1="1305" y1="800" x2="1328" y2="800" class="nt" marker-end="url(#ah-pwr)"/><rect x="1332" y="768" width="288" height="64" rx="10" class="card frame"/><text x="1346" y="792" class="m sm mu">5</text><text x="1366" y="792" class="nm">Power on deadlock</text><text x="1346" y="814" class="sm mu">via BMC once slerm-head answers (≤ 15 min)</text><text x="60" y="858" class="sm">slerm is told power is back. If byteme doesn&#x27;t answer, the watcher retries up to 20 times.</text><text x="60" y="902" class="ey">DISARM</text><text x="60" y="924" class="sm">A switch on the power dashboard mutes the</text><text x="60" y="942" class="sm">response for up to 4 h. Low battery still acts.</text><text x="456" y="902" class="ey">TESTED</text><text x="456" y="924" class="sm">A dry run and a real outage test replay the</text><text x="456" y="942" class="sm">whole sequence from the dashboard.</text><text x="852" y="902" class="ey">VISIBLE</text><text x="852" y="924" class="sm">The power dashboard opens an incident console;</text><text x="852" y="942" class="sm">the Pi wall jumps to its outage scene.</text><text x="1248" y="902" class="ey">LAST REAL ONES</text><text x="1248" y="924" class="sm">1 Oct: two planned pulls of the UPS plug.</text><text x="1248" y="942" class="sm">19 Sep: a 48 s blackout ran the full sequence.</text></svg></body></html>
