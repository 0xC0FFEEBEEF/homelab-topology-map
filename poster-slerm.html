<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>slerm LLM serving</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  /* Layout: one long page on pitch black. Open bands split by hairlines; figures fill the column and
     can switch to full size with sideways scroll. Colour means network, violet means slerm. */
  --bg: #000000;
  --card: #06080c;
  --raise: #0e1118;
  --line: #1b2029;
  --line-2: #2a313d;
  --text: #e7ecf3;
  --text-2: #a4aebd;
  --muted: #677284;
  --accent: #8ea8ff;
  --violet: #b69bff;
  --violet-wash: rgba(182,155,255,.12);
  --lan: #3ddc97;
  --mgmt: #f3b64b;
  --srv: #8ea8ff;
  --dmz: #ff7a90;
  --bad: #ff6b6b;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }

/* svg */
.pz { display: block; height: auto; }
.pz text { font-family: var(--sans); font-size: 12.5px; fill: var(--text-2); }
.pz .m { font-family: var(--mono); font-size: 11px; }
.pz .sm { font-size: 12.5px; }
.pz .xs { font-size: 10.5px; }
.pz .ey { font-size: 10px; letter-spacing: .14em; font-weight: 500; fill: var(--muted); }
.pz .ti { font-size: 17px; font-weight: 600; fill: var(--text); letter-spacing: -.01em; }
.pz .nm { font-size: 13px; font-weight: 600; fill: var(--text); }
.pz .big { font-size: 30px; font-weight: 600; fill: var(--text); letter-spacing: -.02em; }
.pz .mu, .pz tspan.mu { fill: var(--muted); }
.pz .tx { fill: var(--text); }
.pz .card { fill: var(--card); stroke: var(--line-2); stroke-width: 1; }
.pz .frame { fill: none; }
.pz .card-hi { stroke: #3a4352; }
.pz .parked-card { stroke-dasharray: 4 4; }
.pz .hr { stroke: var(--line); stroke-width: 1; }
.pz .grid { stroke: var(--line); stroke-width: 1; }
.pz .w { fill: none; stroke-width: 2.25; stroke-linecap: round; }
.pz .stub { fill: none; stroke-width: 3; stroke-linecap: round; }
.pz .halo { fill: none; stroke: var(--bg); stroke-width: 9; }
.pz .nt { fill: none; stroke: var(--muted); stroke-width: 1.25; }
.pz .dash { stroke-dasharray: 5 5; }
.pz .req { fill: none; stroke: var(--violet); stroke-width: 1.75; }
.pz .ah { fill: var(--muted); }
.pz .pw-b { fill: none; stroke: var(--text-2); stroke-width: 2; }
.pz .pw-s { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 4; }
.pz .psu { fill: var(--text-2); }
.pz .st-run { fill: var(--text); }
.pz .st-off { fill: var(--bg); stroke: var(--text-2); stroke-width: 1.25; }
.pz .pill { fill: none; stroke-width: 1; }
.pz .p-tun { stroke: var(--line-2); }
.pz .pt-tun { fill: var(--text-2); }
.pz .p-slerm { stroke: var(--violet); }
.pz .pt-slerm { fill: var(--violet); }
.pz .p-state { stroke: var(--line-2); fill: var(--card); }
.pz .s-lan { stroke: var(--lan); } .pz .f-lan { fill: var(--lan); }
.pz .s-mgmt { stroke: var(--mgmt); } .pz .f-mgmt { fill: var(--mgmt); }
.pz .s-srv { stroke: var(--srv); } .pz .f-srv { fill: var(--srv); }
.pz .s-dmz { stroke: var(--dmz); } .pz .f-dmz { fill: var(--dmz); }
.pz .seg { stroke: none; }
.pz .gpu1 { fill: var(--violet); } .pz .gpu2 { fill: #8f74e0; }
.pz .cpu1 { fill: #5d6678; } .pz .cpu2 { fill: #4b5364; } .pz .cpu3 { fill: #7a8499; }
.pz .seg-t { fill: #0b0d12; font-weight: 500; }
.pz .bar { fill: var(--violet); }
.pz .b-wait { fill: #3a4352; }
.pz .b-off { fill: var(--text-2); }
.pz .b-keep { fill: #1c2230; stroke: var(--line-2); }
.pz .b-slerm { fill: rgba(182,155,255,.16); stroke: rgba(182,155,255,.45); }
.pz .b-keep + text, .pz .b-slerm + text { fill: var(--text-2); }
.pz .deadline { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 4 3; }
.pz .dl { fill: var(--bad); }

/* motion: packets ride the wires, running dots breathe, tunnels march, the outage replays.
   Everything here is off unless the page sets .motion on the root, so the PNG posters stay still. */
.pz .pk { pointer-events: none; }
:root:not(.motion) .pz .pk { display: none; }
.pz .pk-c { fill: currentColor; }
.pz .pk-h { fill: currentColor; opacity: .2; }
.pz .k-text { color: var(--text); } .pz .k-power { color: var(--text-2); } .pz .k-violet { color: var(--violet); }
.pz .k-lan { color: var(--lan); } .pz .k-mgmt { color: var(--mgmt); }
.pz .k-srv { color: var(--srv); } .pz .k-dmz { color: var(--dmz); }
.pz .ph { display: none; pointer-events: none; transition: opacity .6s var(--ease); }
.motion .pz .ph.on { display: inline; }
.pz .ph-veil { fill: var(--bg); opacity: .62; }
.pz .ph-line { stroke: var(--text); stroke-width: 1.25; }
.pz .ph-tag { fill: var(--text); }
.pz .ph-t { font-family: var(--mono); font-size: 10.5px; font-weight: 500; fill: var(--bg); }
.motion .pz .st-run { animation: breathe 3.6s ease-in-out infinite; }
.motion .pz .dash { animation: march 1.6s linear infinite; }
.motion .pz .p-state { animation: state-on 10s linear infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes march { to { stroke-dashoffset: 10; } }
@keyframes state-on {
  0%, 22% { stroke: var(--violet); fill: var(--violet-wash); }
  26%, 100% { stroke: var(--line-2); fill: var(--card); }
}

/* scroll reveal: the page hides only what starts below the fold (.rv-on on the root), then builds each
   diagram as it scrolls in. Cards rise, wires draw, bars grow, text settles; traffic starts when it's done. */
.rv-on .pz .rv-s { opacity: 0; animation: none; }
.rv-on .pz .rv-in { animation: rv-fade .55s var(--ease) both; }
.rv-on .pz text.rv-in { animation-name: rv-rise; animation-duration: .65s; }
.rv-on .pz .card.rv-in { animation: rv-card .75s var(--ease) both; transform-box: fill-box; transform-origin: 50% 50%; }
.rv-on .pz line.rv-in.w, .rv-on .pz line.rv-in.req, .rv-on .pz line.rv-in.pw-b,
.rv-on .pz line.rv-in.nt:not(.dash), .rv-on .pz path.rv-in.nt {
  stroke-dasharray: var(--len) var(--len); animation: rv-draw .95s var(--ease) both; }
.rv-on .pz .rv-in.b-wait, .rv-on .pz .rv-in.b-off, .rv-on .pz .rv-in.b-keep, .rv-on .pz .rv-in.b-slerm,
.rv-on .pz .rv-in.bar, .rv-on .pz .rv-in.seg {
  animation: rv-grow .9s var(--ease) both; transform-box: fill-box; transform-origin: 0 50%; }
.rv-on .pz.rv-pending .pk, .rv-on .pz.rv-pending .ph { visibility: hidden; }
@keyframes rv-fade { from { opacity: 0; } }
@keyframes rv-rise { from { opacity: 0; translate: 0 8px; } }
@keyframes rv-card { from { opacity: 0; scale: .96; } }
@keyframes rv-draw { 0% { stroke-dashoffset: var(--len); opacity: 0; } 25% { opacity: 1; } }
@keyframes rv-grow { from { scale: 0 1; } }
 body { margin: 0; } .pz { width: auto; }</style></head>
<body><svg class="pz " viewBox="0 0 1680 802" width="1680" height="802" role="img" aria-label="slerm cluster: clients call one gateway on slerm-head, which starts a llama.cpp router on node04; the router runs a model on its two Tesla P100s and keeps any overflow on node04&#x27;s own CPUs." data-w="1680"><defs><marker id="ah-slerm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="60" y="62" class="big">slerm<tspan class="mu"> LLM serving</tspan></text><text x="60" y="90" class="sm mu">one slerm workload · llama.cpp on two Tesla P100s, CPU overflow for the biggest models</text><circle cx="1334" cy="36" r="3.5" class="st-run" style="animation-delay:-1.37s"/><text x="1344" y="40" class="sm">running now</text><circle cx="1444" cy="36" r="3.5" class="st-off"/><text x="1454" y="40" class="sm">powered off until a request</text><line x1="1334" y1="60" x2="1358" y2="60" class="req"/><text x="1366" y="64" class="sm">request path</text><text x="60" y="150" class="ey">CLIENTS · ONE OPENAI-STYLE ENDPOINT</text><text x="60" y="180" class="nm">Open WebUI</text><text x="60" y="196" class="sm mu">chat, on Cryo-Ai</text><line x1="300" y1="176" x2="356" y2="176" class="req"/><text x="60" y="220" class="nm">opencode</text><text x="60" y="236" class="sm mu">on Ghost and in Open WebUI Code mode</text><line x1="300" y1="216" x2="356" y2="216" class="req"/><text x="60" y="260" class="nm">Computer Agent</text><text x="60" y="276" class="sm mu">drives the AI-Sandbox desktop</text><line x1="300" y1="256" x2="356" y2="256" class="req"/><text x="60" y="300" class="nm">delegate</text><text x="60" y="316" class="sm mu">Claude Code hands off grunt work</text><line x1="300" y1="296" x2="356" y2="296" class="req"/><text x="60" y="340" class="nm">zsh-ai</text><text x="60" y="356" class="sm mu">shell assistant</text><line x1="300" y1="336" x2="356" y2="336" class="req"/><text x="60" y="380" class="nm">Firstlook</text><text x="60" y="396" class="sm mu">eBay listing filter</text><line x1="300" y1="376" x2="356" y2="376" class="req"/><text x="60" y="420" class="nm">Wazuh triage</text><text x="60" y="436" class="sm mu">slerm panel, alerts from Wuzah</text><line x1="300" y1="416" x2="356" y2="416" class="req"/><line x1="356" y1="176" x2="356" y2="416" class="req"/><text x="416" y="174" class="ey">VM ON BYTEME · ROCKY LINUX · 2 vCPU · 4 GB</text><circle cx="420" cy="196" r="3.5" class="st-run" style="animation-delay:-2.74s"/><text x="432" y="200" class="ti">slerm-head</text><line x1="401" y1="218" x2="799" y2="218" class="hr"/><text x="416" y="246" class="nm">gateway</text><text x="528" y="246" class="sm">holds requests while nodes wake</text><text x="416" y="290" class="nm">slerm-orch</text><text x="528" y="290" class="sm">starts routers · idles · powers nodes</text><line x1="416" y1="264" x2="784" y2="264" class="hr"/><text x="416" y="334" class="nm">Slurm</text><text x="528" y="334" class="sm">slurmctld + slurmdbd on MariaDB</text><line x1="416" y1="308" x2="784" y2="308" class="hr"/><text x="416" y="378" class="nm">NFS · 700 GB</text><text x="528" y="378" class="sm">models, apps and home directories</text><line x1="416" y1="352" x2="784" y2="352" class="hr"/><text x="416" y="422" class="nm">panel</text><text x="528" y="422" class="sm">cluster, jobs, AI usage, Wazuh triage</text><line x1="416" y1="396" x2="784" y2="396" class="hr"/><rect x="400" y="150" width="400" height="302" rx="10" class="card frame"/><line x1="356" y1="242" x2="398" y2="242" class="req" marker-end="url(#ah-slerm)"/><rect x="880" y="150" width="360" height="170" rx="10" class="card card-hi"/><text x="896" y="174" class="ey">VM · BYTEME · 36 vCPU · 45 GB</text><circle cx="900" cy="196" r="3.5" class="st-off"/><text x="912" y="200" class="ti">slerm-node04</text><text x="896" y="226" class="sm">2× Tesla P100 · 16 GB each · Pascal (cc 6.0)</text><text x="896" y="246" class="sm">llama-server in router mode, one model at a time</text><text x="896" y="266" class="sm">100 GB local model cache · a 1B task model beside it</text><rect x="896" y="286" width="30" height="15" rx="7.5" class="pill p-tun"/><text x="911" y="297" class="m xs pt-tun" text-anchor="middle">gpu</text><rect x="931" y="286" width="30" height="15" rx="7.5" class="pill p-tun"/><text x="946" y="297" class="m xs pt-tun" text-anchor="middle">llm</text><line x1="800" y1="242" x2="878" y2="242" class="req" marker-end="url(#ah-slerm)"/><text x="840" y="234" class="m xs mu" text-anchor="middle">HTTP</text><text x="1264" y="174" class="ey">HOW A MODEL IS SPLIT ACROSS THE POOL</text><text x="1264" y="200" class="sm">qwen3.6 35B-A3B (25 GB): both cards</text><rect x="1264" y="208" width="165.82" height="16" rx="2" class="seg gpu1"/><text x="1270" y="220" class="m xs seg-t">P100 #1 47</text><rect x="1431.32" y="208" width="187.18" height="16" rx="2" class="seg gpu2"/><text x="1437.32" y="220" class="m xs seg-t">P100 #2 53</text><text x="1264" y="250" class="sm">gpt-oss 120B (59 GB): overflow on the CPUs</text><rect x="1264" y="258" width="73.26" height="16" rx="2" class="seg gpu1"/><text x="1270" y="270" class="m xs seg-t">P100 #1 21</text><rect x="1338.76" y="258" width="87.5" height="16" rx="2" class="seg gpu2"/><text x="1344.76" y="270" class="m xs seg-t">P100 #2 25</text><rect x="1427.76" y="258" width="190.74" height="16" rx="2" class="seg cpu3"/><text x="1433.76" y="270" class="m xs seg-t">node04 CPUs 54</text><rect x="1264" y="290" width="10" height="10" rx="2" class="seg gpu1"/><text x="1278" y="299" class="m xs mu">P100 #1</text><rect x="1336.2" y="290" width="10" height="10" rx="2" class="seg gpu2"/><text x="1350.2" y="299" class="m xs mu">P100 #2</text><rect x="1408.4" y="290" width="10" height="10" rx="2" class="seg cpu3"/><text x="1422.4" y="299" class="m xs mu">node04 CPUs</text><text x="1264" y="322" class="xs mu">layer shares from models.ini · small models use one card</text><line x1="1060" y1="320" x2="1060" y2="372" class="req"/><line x1="965" y1="372" x2="1345" y2="372" class="req"/><text x="1070" y="362" class="m xs mu">ggml-rpc · CPU nodes can join or stand in for node04 · no preset needs them now</text><line x1="965" y1="372" x2="965" y2="408" class="req" marker-end="url(#ah-slerm)"/><rect x="880" y="410" width="170" height="150" rx="10" class="card frame"/><text x="894" y="432" class="ey">VM · BYTEME2</text><circle cx="898" cy="452" r="3.5" class="st-off"/><text x="910" y="456" class="nm">slerm-node01</text><text x="894" y="480" class="sm">CPU only</text><text x="894" y="498" class="sm mu">16 vCPU · 12 GB</text><text x="894" y="516" class="m xs mu">off until needed</text><rect x="894" y="530" width="54" height="15" rx="7.5" class="pill p-tun"/><text x="921" y="541" class="m xs pt-tun" text-anchor="middle">compute</text><rect x="953" y="530" width="48" height="15" rx="7.5" class="pill p-tun"/><text x="977" y="541" class="m xs pt-tun" text-anchor="middle">llmcpu</text><line x1="1155" y1="372" x2="1155" y2="408" class="req" marker-end="url(#ah-slerm)"/><rect x="1070" y="410" width="170" height="150" rx="10" class="card frame"/><text x="1084" y="432" class="ey">VM · BYTEME2</text><circle cx="1088" cy="452" r="3.5" class="st-off"/><text x="1100" y="456" class="nm">slerm-node02</text><text x="1084" y="480" class="sm">CPU only</text><text x="1084" y="498" class="sm mu">16 vCPU · 12 GB</text><text x="1084" y="516" class="m xs mu">off until needed</text><rect x="1084" y="530" width="54" height="15" rx="7.5" class="pill p-tun"/><text x="1111" y="541" class="m xs pt-tun" text-anchor="middle">compute</text><rect x="1143" y="530" width="48" height="15" rx="7.5" class="pill p-tun"/><text x="1167" y="541" class="m xs pt-tun" text-anchor="middle">llmcpu</text><line x1="1345" y1="372" x2="1345" y2="408" class="req" marker-end="url(#ah-slerm)"/><rect x="1260" y="410" width="170" height="150" rx="10" class="card frame"/><text x="1274" y="432" class="ey
